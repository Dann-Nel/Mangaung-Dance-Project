<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#g1)" />

  <!-- subtle grain -->
  <rect width="480" height="600" fill="#000" opacity="0.08" />

  <!-- motif -->
  
        <g opacity="0.4">
          <polygon points="120,520 220,360 260,360 160,520" fill="#FF2E5B" />
          <polygon points="260,520 340,400 370,400 290,520" fill="#FF2E5B" opacity="0.6" />
        </g>

  <!-- accent bar -->
  <rect x="40" y="60" width="40" height="3" fill="#FF2E5B" />

  <!-- top eyebrow -->
  <text x="40" y="52" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#FF2E5B" letter-spacing="2">
    TOWNSHIP · JOHANNESBURG / MANGAUNG
  </text>

  <!-- huge dance name -->
  <text x="40" y="118" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#F4F1EC" letter-spacing="1">
    PANTSULA
  </text>

  <!-- caption block at bottom -->
  <rect x="0" y="510" width="480" height="90" fill="#0B0B0D" opacity="0.75" />
  <text x="40" y="545" font-family="Montserrat, sans-serif" font-weight="700" font-size="18" fill="#F4F1EC">
    All Stars
  </text>
  <text x="40" y="573" font-family="Inter, sans-serif" font-size="13" fill="#F4F1EC" opacity="0.7">
    Low-slung. Converse. Spotti caps.
  </text>
  <text x="440" y="573" font-family="'Space Mono', monospace" font-size="10" fill="#FF2E5B" text-anchor="end" letter-spacing="1">
    01 / 04
  </text>
</svg>
