<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F1E14" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#g1)" />

  <!-- subtle grain -->
  <rect width="480" height="600" fill="#000" opacity="0.08" />

  <!-- motif -->
  <g><circle cx="240" cy="400" r="40" fill="none" stroke="#D97B2A" stroke-width="3" opacity="0.6" /><circle cx="240" cy="400" r="70" fill="none" stroke="#D97B2A" stroke-width="3" opacity="0.52" /><circle cx="240" cy="400" r="100" fill="none" stroke="#D97B2A" stroke-width="3" opacity="0.43999999999999995" /><circle cx="240" cy="400" r="130" fill="none" stroke="#D97B2A" stroke-width="3" opacity="0.36" /><circle cx="240" cy="400" r="160" fill="none" stroke="#D97B2A" stroke-width="3" opacity="0.27999999999999997" /></g>

  <!-- accent bar -->
  <rect x="40" y="60" width="40" height="3" fill="#D97B2A" />

  <!-- top eyebrow -->
  <text x="40" y="52" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#D97B2A" letter-spacing="2">
    TSWANA · HARVEST GROUND
  </text>

  <!-- huge dance name -->
  <text x="40" y="118" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#F4F1EC" letter-spacing="1">
    SETAPA
  </text>

  <!-- caption block at bottom -->
  <rect x="0" y="510" width="480" height="90" fill="#0B0B0D" opacity="0.75" />
  <text x="40" y="545" font-family="Montserrat, sans-serif" font-weight="700" font-size="18" fill="#F4F1EC">
    Koto print
  </text>
  <text x="40" y="573" font-family="Inter, sans-serif" font-size="13" fill="#F4F1EC" opacity="0.7">
    Shweshwe · leteisi cloth.
  </text>
  <text x="440" y="573" font-family="'Space Mono', monospace" font-size="10" fill="#D97B2A" text-anchor="end" letter-spacing="1">
    01 / 04
  </text>
</svg>
