<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B2A1E" />
      <stop offset="100%" stop-color="#0B0B0D" />
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#g2)" />

  <!-- subtle grain -->
  <rect width="480" height="600" fill="#000" opacity="0.08" />

  <!-- motif -->
  
        <g opacity="0.35">
          <circle cx="200" cy="340" r="30" fill="#E8A838" />
          <rect x="175" y="365" width="50" height="100" rx="14" fill="#E8A838" />
          <circle cx="280" cy="340" r="30" fill="#E8A838" />
          <rect x="255" y="365" width="50" height="100" rx="14" fill="#E8A838" />
          <line x1="215" y1="390" x2="265" y2="390" stroke="#E8A838" stroke-width="6" />
        </g>

  <!-- accent bar -->
  <rect x="40" y="60" width="40" height="3" fill="#E8A838" />

  <!-- top eyebrow -->
  <text x="40" y="52" font-family="'Space Mono', 'Courier New', monospace" font-size="10" fill="#E8A838" letter-spacing="2">
    AFRIKAANS · MANGAUNG
  </text>

  <!-- huge dance name -->
  <text x="40" y="118" font-family="Montserrat, 'Arial Black', sans-serif" font-weight="900" font-size="48" fill="#F4F1EC" letter-spacing="1">
    SOKKIE
  </text>

  <!-- caption block at bottom -->
  <rect x="0" y="510" width="480" height="90" fill="#0B0B0D" opacity="0.75" />
  <text x="40" y="545" font-family="Montserrat, sans-serif" font-weight="700" font-size="18" fill="#F4F1EC">
    UFS sokkie-jol
  </text>
  <text x="40" y="573" font-family="Inter, sans-serif" font-size="13" fill="#F4F1EC" opacity="0.7">
    First-year orientation.
  </text>
  <text x="440" y="573" font-family="'Space Mono', monospace" font-size="10" fill="#E8A838" text-anchor="end" letter-spacing="1">
    02 / 04
  </text>
